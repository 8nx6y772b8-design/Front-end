name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Run tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk tuner.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tuner-apk
          path: tuner.apk

      # A fixed download link for the Fire Stick:
      #   https://github.com/<owner>/<repo>/releases/download/latest/tuner.apk
      - name: Publish to the "latest" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest tuner.apk \
            --title "Latest build (#${{ github.run_number }})" \
            --notes "Built from ${{ github.sha }}" \
            --target ${{ github.sha }}
